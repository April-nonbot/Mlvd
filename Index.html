```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Run 🌈</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="menu">
        <h1>🌈 Rainbow Run 🌈</h1>

        <p class="subtitle">Choose your character!</p>

        <div class="choices">

            <button class="character" onclick="chooseCharacter('leprechaun')">
                🍀
                <span>Leprechaun</span>
            </button>

            <button class="character" onclick="chooseCharacter('unicorn')">
                🦄
                <span>Unicorn</span>
            </button>

        </div>

        <p class="subtitle">Choose your world!</p>

        <div class="choices">

            <button class="world" onclick="chooseWorld('fairy')">
                🧚
                <span>Fairy Forest</span>
            </button>

            <button class="world" onclick="chooseWorld('unicorn')">
                🌈
                <span>Unicorn Valley</span>
            </button>

        </div>

        <button id="startButton" onclick="startGame()">
            ▶ START GAME
        </button>
    </div>


    <div id="gameContainer">

        <div id="topBar">
            <span>🪙 Coins: <b id="coins">0</b></span>
            <span>⭐ Score: <b id="score">0</b></span>
            <span>🏆 Best: <b id="highScore">0</b></span>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="gameOver">

            <h1>Game Over!</h1>

            <p>Your score:</p>
            <h2 id="finalScore">0</h2>

            <button onclick="restartGame()">🔄 Play Again</button>
            <button onclick="returnToMenu()">🏠 Menu</button>

        </div>

        <div id="mobileControls">
            <button onclick="jump()">⬆️ JUMP</button>
        </div>

    </div>


    <script src="game.js"></script>

</body>
</html>
```
